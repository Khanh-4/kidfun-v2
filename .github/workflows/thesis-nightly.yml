# Tác vụ ban đêm của đồ án chuyên ngành (T7.1.5, T7.3.1): đọc dữ liệu qua /api/cron/thesis-data một lần,
# tính mức thường ngày cho luật tầng 1 + dự đoán M1 cho ngày mai, gửi cả hai lên backend.
# Lỗi (exit ≠ 0) → GitHub gửi email.
name: thesis-nightly

on:
  schedule:
    - cron: "5 14 * * *" # 21:05 giờ VN
  workflow_dispatch:
    inputs:
      push:
        description: "Gửi baseline + dự đoán lên backend (bỏ chọn = chỉ tính và in báo cáo)"
        type: boolean
        default: true

concurrency:
  group: thesis-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-job.txt

      - name: Cài thư viện
        run: pip install -r requirements-job.txt

      - name: Baseline tầng 1 + dự đoán M1
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          THESIS_API_URL: ${{ vars.THESIS_API_URL || 'https://kidfun-backend.vercel.app' }}
          PUSH_FLAG: ${{ (github.event_name == 'schedule' || inputs.push) && '--push' || '' }}
        run: python -m jobs.nightly $PUSH_FLAG
